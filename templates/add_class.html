{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Add Class</h2>
  <form method="post">
    <label>Class Name</label>
    <input type="text" name="class_name" required />
    <label>Schedule</label>
    <input type="text" name="schedule" placeholder="e.g. Mon-Wed-Fri 7:00 AM" required />
    <label>Trainer</label>
    <input type="text" name="trainer" required />
    <div class="form-actions">
      <input type="submit" value="Save Class" />
      <a href="{{ url_for('classes') }}"><button type="button">Cancel</button></a>
    </div>
  </form>
</div>
{% endblock %}
