{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Add Member</h2>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" required />
    <label>Email</label>
    <input type="email" name="email" required />
    <label>Phone</label>
    <input type="text" name="phone" required />
    <label>Membership Type</label>
    <select name="membership_type">
      <option value="Monthly" {% if membership_type == 'Monthly' %}selected{% endif %}>Monthly</option>
      <option value="Quarterly" {% if membership_type == 'Quarterly' %}selected{% endif %}>Quarterly</option>
      <option value="Yearly" {% if membership_type == 'Yearly' %}selected{% endif %}>Yearly</option>
    </select>
    <label>Preferred Trainer</label>
    <select name="trainer_id">
      <option value="">-- Choose a trainer --</option>
      {% for trainer in trainers %}
      <option value="{{ trainer.id }}">{{ trainer.name }}</option>
      {% endfor %}
    </select>
    <div class="form-actions">
      <input type="submit" value="Save Member" />
      <a href="{{ url_for('members') }}"><button type="button">Cancel</button></a>
    </div>
  </form>
</div>
{% endblock %}
