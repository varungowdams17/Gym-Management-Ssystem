{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Edit Trainer</h2>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ trainer.name }}" required />
    <label>Specialty</label>
    <input type="text" name="specialty" value="{{ trainer.specialty }}" required />
    <label>Phone</label>
    <input type="text" name="phone" value="{{ trainer.phone }}" required />
    <div class="form-actions">
      <input type="submit" value="Update Trainer" />
      <a href="{{ url_for('trainers') }}"><button type="button">Cancel</button></a>
    </div>
  </form>
</div>
{% endblock %}
