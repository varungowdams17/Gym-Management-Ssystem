{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="form-actions">
    <h2>Classes</h2>
    <a href="{{ url_for('add_class') }}"><button>Add New Class</button></a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Class Name</th>
        <th>Schedule</th>
        <th>Trainer</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for gym_class in classes %}
      <tr>
        <td>{{ gym_class.class_name }}</td>
        <td>{{ gym_class.schedule }}</td>
        <td>{{ gym_class.trainer }}</td>
        <td>{{ gym_class.created_at }}</td>
        <td>
          <a href="{{ url_for('edit_class', id=gym_class.id) }}"><button>Edit</button></a>
          <form action="{{ url_for('delete_class', id=gym_class.id) }}" method="post" style="display:inline;">
            <button type="submit" class="delete-button">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
