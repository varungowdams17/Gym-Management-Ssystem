{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="form-actions">
    <h2>Payments</h2>
    <a href="{{ url_for('add_payment') }}"><button>Record Payment</button></a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Member</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      {% for payment in payments %}
      <tr>
        <td>{{ payment.member_name }}</td>
        <td>${{ '%.2f'|format(payment.amount) }}</td>
        <td>{{ payment.payment_date }}</td>
        <td>{{ payment.notes }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
