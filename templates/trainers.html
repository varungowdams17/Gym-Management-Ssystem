{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="form-actions">
    <h2>Trainers</h2>
    <a href="{{ url_for('add_trainer') }}"><button>Add New Trainer</button></a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Specialty</th>
        <th>Phone</th>
        <th>Hire Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for trainer in trainers %}
      <tr>
        <td>{{ trainer.name }}</td>
        <td>{{ trainer.specialty }}</td>
        <td>{{ trainer.phone }}</td>
        <td>{{ trainer.hire_date }}</td>
        <td>
          <a href="{{ url_for('edit_trainer', id=trainer.id) }}"><button>Edit</button></a>
          <form action="{{ url_for('delete_trainer', id=trainer.id) }}" method="post" style="display:inline;">
            <button type="submit" class="delete-button">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
