{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Edit Member</h2>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ member.name }}" required />
    <label>Email</label>
    <input type="email" name="email" value="{{ member.email }}" required />
    <label>Phone</label>
    <input type="text" name="phone" value="{{ member.phone }}" required />
    <label>Membership Type</label>
    <select name="membership_type">
      <option value="Monthly" {% if member.membership_type == 'Monthly' %}selected{% endif %}>Monthly</option>
      <option value="Quarterly" {% if member.membership_type == 'Quarterly' %}selected{% endif %}>Quarterly</option>
      <option value="Yearly" {% if member.membership_type == 'Yearly' %}selected{% endif %}>Yearly</option>
    </select>
    <label>Preferred Trainer</label>
    <select name="trainer_id">
      <option value="">-- Choose a trainer --</option>
      {% for trainer in trainers %}
      <option value="{{ trainer.id }}" {% if member.trainer_id == trainer.id %}selected{% endif %}>{{ trainer.name }}</option>
      {% endfor %}
    </select>
    <div class="form-actions">
      <input type="submit" value="Update Member" />
      <a href="{{ url_for('members') }}"><button type="button">Cancel</button></a>
    </div>
  </form>
</div>
{% endblock %}
